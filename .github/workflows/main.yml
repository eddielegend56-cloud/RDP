name: RDP Files + Tailscale

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  setup:
    runs-on: windows-latest

    steps:

      # =========================================================
      # 1. Prepare RDP user's folders
      # =========================================================
      - name: Prepare RDP folders
        shell: powershell
        run: |
          $folders = @(
            "C:\Users\RDP\Desktop",
            "C:\Users\RDP\Documents",
            "C:\Users\RDP\Downloads",
            "C:\Users\RDP\Pictures",
            "C:\Users\RDP\Videos",
            "C:\Users\RDP\Music"
          )

          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
          }

          Write-Host "Folders ready."

      # =========================================================
      # 2. Find the newest RDP-backup artifact using GitHub API
      # =========================================================
      - name: Find previous backup
        id: find_backup
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $owner = "${{ github.repository_owner }}"
          $repo  = "${{ github.event.repository.name }}"

          $url = "https://api.github.com/repos/$owner/$repo/actions/artifacts?name=RDP-backup&per_page=100"

          $response = Invoke-RestMethod `
            -Uri $url `
            -Headers $headers `
            -Method Get

          $artifact = $response.artifacts |
            Where-Object {
              $_.name -eq "RDP-backup" -and
              $_.expired -eq $false
            } |
            Sort-Object created_at -Descending |
            Select-Object -First 1

          if ($null -eq $artifact) {
            Write-Host "No previous backup found."
            "FOUND=false" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "Previous backup found."
            Write-Host "Artifact ID: $($artifact.id)"
            Write-Host "Created: $($artifact.created_at)"

            "FOUND=true" >> $env:GITHUB_OUTPUT
            "ARTIFACT_ID=$($artifact.id)" >> $env:GITHUB_OUTPUT
          }

      # =========================================================
      # 3. Download previous artifact through GitHub API
      # =========================================================
      - name: Download previous backup
        if: steps.find_backup.outputs.FOUND == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactId = "${{ steps.find_backup.outputs.ARTIFACT_ID }}"
          $output = "$env:TEMP\RDP-backup.zip"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $owner = "${{ github.repository_owner }}"
          $repo  = "${{ github.event.repository.name }}"

          $url = "https://api.github.com/repos/$owner/$repo/actions/artifacts/$artifactId/zip"

          Invoke-WebRequest `
            -Uri $url `
            -Headers $headers `
            -OutFile $output

          if (-not (Test-Path $output)) {
            Write-Error "Backup download failed."
            exit 1
          }

          Write-Host "Backup downloaded."

      # =========================================================
      # 4. Restore previous files
      # =========================================================
      - name: Restore previous files
        if: steps.find_backup.outputs.FOUND == 'true'
        shell: powershell
        run: |
          $zip = "$env:TEMP\RDP-backup.zip"
          $destination = "C:\Users\RDP"

          Write-Host "Restoring files..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $destination `
            -Force

          Write-Host "Files restored."

      # =========================================================
      # 5. Install Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          Write-Host "Tailscale installed."

      # =========================================================
      # 6. Connect to your Tailscale network
      # =========================================================
      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            Write-Error "Tailscale executable was not found."
            exit 1
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-runner-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "========== TAILSCALE =========="
          & $tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          & $tailscale ip -4

          Write-Host "==============================="

      # =========================================================
      # 7. Show restored files
      # =========================================================
      - name: Verify files
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== RESTORED FILES =========="

          Get-ChildItem `
            -Path "C:\Users\RDP" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "===================================="

      # =========================================================
      # 8. Your work goes here
      # =========================================================
      - name: Working environment
        shell: powershell
        run: |
          Write-Host "Your restored files are located at:"
          Write-Host "C:\Users\RDP"

          Write-Host ""
          Write-Host "Tailscale is connected."

          # Put your legitimate commands/tasks here.

      # =========================================================
      # 9. Create a new backup
      # =========================================================
      - name: Create RDP backup
        if: always()
        shell: powershell
        run: |
          $source = "C:\Users\RDP"
          $backupDir = "$env:GITHUB_WORKSPACE\backup"
          $backupZip = "$backupDir\RDP-backup.zip"

          New-Item `
            -ItemType Directory `
            -Path $backupDir `
            -Force | Out-Null

          if (Test-Path $backupZip) {
            Remove-Item $backupZip -Force
          }

          $paths = @(
            "$source\Desktop\*",
            "$source\Documents\*",
            "$source\Downloads\*",
            "$source\Pictures\*",
            "$source\Videos\*",
            "$source\Music\*"
          )

          $existing = @()

          foreach ($path in $paths) {
            $parent = Split-Path $path -Parent

            if (Test-Path $parent) {
              $existing += $path
            }
          }

          if ($existing.Count -gt 0) {
            Compress-Archive `
              -Path $existing `
              -DestinationPath $backupZip `
              -CompressionLevel Optimal `
              -Force

            Write-Host "Backup created successfully."
          }
          else {
            Write-Host "Nothing to back up."
          }

      # =========================================================
      # 10. Upload backup to GitHub Actions artifact storage
      # =========================================================
      - name: Upload RDP backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RDP-backup
          path: backup/RDP-backup.zip
          if-no-files-found: warn
          retention-days: 90
