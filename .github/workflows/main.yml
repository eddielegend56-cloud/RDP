name: Persistent RDP with Tailscale

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]
    paths:
      - 'session-state/**'
      - 'rdp-info.txt'

jobs:
  persistent-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Restore Previous Session State
        run: |
          if (Test-Path "session-state") {
            Write-Host "Restoring previous session state..."
            $restorePaths = @(
              @{Source="session-state/Desktop"; Dest="$env:USERPROFILE\Desktop"},
              @{Source="session-state/Documents"; Dest="$env:USERPROFILE\Documents"},
              @{Source="session-state/Downloads"; Dest="$env:USERPROFILE\Downloads"}
            )
            foreach ($path in $restorePaths) {
              if (Test-Path $path.Source) {
                if (-not (Test-Path $path.Dest)) {
                  New-Item -ItemType Directory -Path $path.Dest -Force | Out-Null
                }
                Copy-Item -Path "$($path.Source)\*" -Destination $path.Dest -Recurse -Force -ErrorAction SilentlyContinue
                Write-Host "Restored: $($path.Source)"
              }
            }
            Write-Host "Session state restored successfully!"
          } else {
            Write-Host "No previous session state found. Starting fresh."
          }

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $userExists = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          if ($userExists) {
            Write-Host "RDP user already exists"
            $password = "RDP@123456"
          } else {
            Add-Type -AssemblyName System.Security
            $charSet = @{
                Upper   = [char[]](65..90)
                Lower   = [char[]](97..122)
                Number  = [char[]](48..57)
                Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
            }
            $rawPassword = @()
            $rawPassword += $charSet.Upper | Get-Random -Count 4
            $rawPassword += $charSet.Lower | Get-Random -Count 4
            $rawPassword += $charSet.Number | Get-Random -Count 4
            $rawPassword += $charSet.Special | Get-Random -Count 4
            $password = -join ($rawPassword | Sort-Object { Get-Random })
            $securePass = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member "RDP"
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          }
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
            Write-Host "Tailscale already installed"
          } else {
            $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $installerPath = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
            Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
            Remove-Item $installerPath -Force
          }

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-persistent
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          $infoContent = "RDP Connection Info`n==================`nTailscale IP: $tsIP`nUsername: RDP`nPassword: $env:RDP_PASSWORD`nLast Updated: $(Get-Date)"
          Set-Content -Path "rdp-info.txt" -Value $infoContent -Encoding UTF8

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection with Auto-Save
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=================="
          
          New-Item -ItemType Directory -Path "session-state" -Force | Out-Null
          
          function Save-SessionState {
            Write-Host "[$(Get-Date)] Saving session state..."
            $savePaths = @(
              @{Source="$env:USERPROFILE\Desktop"; Dest="session-state/Desktop"},
              @{Source="$env:USERPROFILE\Documents"; Dest="session-state/Documents"},
              @{Source="$env:USERPROFILE\Downloads"; Dest="session-state/Downloads"}
            )
            foreach ($path in $savePaths) {
              if (Test-Path $path.Source) {
                New-Item -ItemType Directory -Path $path.Dest -Force | Out-Null
                Get-ChildItem -Path $path.Source -File -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination $path.Dest -Force -ErrorAction SilentlyContinue
              }
            }
            $infoContent = "RDP Connection Info`n==================`nTailscale IP: $env:TAILSCALE_IP`nUsername: RDP`nPassword: $env:RDP_PASSWORD`nLast Updated: $(Get-Date)"
            Set-Content -Path "rdp-info.txt" -Value $infoContent -Encoding UTF8
            
            git config --global user.email "action@github.com"
            git config --global user.name "GitHub Action"
            git add session-state/ rdp-info.txt
            git commit -m "Auto-save at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" --allow-empty
            git pull --rebase origin main
            git push origin main
            Write-Host "Session state saved!"
          }
          
          $saveCounter = 0
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              $saveCounter++
              if ($saveCounter -ge 2) {
                  Save-SessionState
                  $saveCounter = 0
              }
              Start-Sleep -Seconds 300
          }

      - name: Final Save Before Timeout
        if: always()
        run: |
          Write-Host "Performing final save..."
          if (Test-Path "$env:USERPROFILE\Desktop") {
            New-Item -ItemType Directory -Path "session-state/Desktop" -Force | Out-Null
            Get-ChildItem -Path "$env:USERPROFILE\Desktop" -File -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination "session-state/Desktop" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:USERPROFILE\Documents") {
            New-Item -ItemType Directory -Path "session-state/Documents" -Force | Out-Null
            Get-ChildItem -Path "$env:USERPROFILE\Documents" -File -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination "session-state/Documents" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:USERPROFILE\Downloads") {
            New-Item -ItemType Directory -Path "session-state/Downloads" -Force | Out-Null
            Get-ChildItem -Path "$env:USERPROFILE\Downloads" -File -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination "session-state/Downloads" -Force -ErrorAction SilentlyContinue
          }
          
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add session-state/ rdp-info.txt
          git commit -m "Final save at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" --allow-empty
          git pull --rebase origin main
          git push origin main
          Write-Host "Final save completed!"
